# update — upstream version sweep, chained to the cascade (replaces
# anda-update.yml).
#
# Runs ci/sweep/sweep.py (the applications registry's upstream feeds). The
# sweeper edits specs in place and writes only real changes; this workflow
# lands them:
#
#   mode=commit (default)  push `bump: <date> (<pkgs>)` straight to main —
#                          the push makes copr-build.yml rebuild the changed
#                          packages and every higher batch. Fully automatic:
#                          upstream release -> spec bump -> Copr build -> repo
#                          update, no human in the loop. A failed Copr build
#                          leaves the published repo on the last good version,
#                          so bad bumps self-heal.
#   mode=pr                land the bumps on one bump/<date> branch and open a
#                          single PR, like the anda era — set the UPDATE_MODE
#                          repository variable (or the dispatch input) to opt
#                          into the review gate.
#
# GITHUB_TOKEN feeds the sweeper's GitHub API calls (rate limits); it is only
# ever sent to api.github.com.
name: update

on:
  # two triggers, two purposes: the daily cron is the floor (sweeps even on
  # a day with no cascade; it also reconciles git against Copr, below), and the workflow_run chain sweeps right after
  # every successful copr-build so fresh builds meet the newest upstream
  # immediately. A bump's own cascade re-triggers the sweep once more; that
  # second run finds nothing upstream and exits without committing, so the
  # chain ends.
  schedule:
    - cron: "17 04 * * *"
  workflow_run:
    workflows: [copr-build]
    types: [completed]
  workflow_dispatch:
    inputs:
      mode:
        description: "How to land bumps (schedule runs use the UPDATE_MODE var, else commit)"
        required: false
        default: "commit"
        type: choice
        options: ["commit", "pr"]
      pkg:
        description: "Sweep only these packages (space separated); empty = all"
        required: false
        default: ""

permissions:
  contents: write
  packages: read
  pull-requests: write
  actions: write
  issues: write

concurrency:
  group: update
  # queue, never cancel: a canceled run can strand a pushed bump before its
  # copr-build dispatch, and the next no-op sweep would not resubmit it.
  # Queued sweeps are cheap and idempotent.
  cancel-in-progress: false

jobs:
  sweep:
    # workflow_run fires for failed cascades too — sweep only after a
    # successful one (a failed cascade published nothing new)
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    container:
      image: ghcr.io/halcyon-linux/applications-builder:f44
      credentials:
        username: ${{ github.actor }}
        password: ${{ github.token }}

    env:
      MODE: ${{ inputs.mode || vars.UPDATE_MODE || 'commit' }}
      PKGS: ${{ inputs.pkg }}
    steps:
      - name: Workspace safe
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - name: Configure git
        run: |
          git config user.name "halcyon-autoupdate"
          git config user.email "aahsnr041@proton.me"
      # The sweep only sees NEW upstream versions. A bump whose dispatch was
      # lost, or whose Copr build failed, would never be retried — compare
      # every spec to the latest succeeded Copr build and resubmit the
      # difference. Runs BEFORE the sweep so pr-mode's unmerged edits are
      # never mistaken for stale builds.
      - name: Find packages Copr has not published
        id: reconcile
        run: |
          set -eu
          # a build that failed on the current NVR is retried only on Mondays
          retry=""; [ "$(date -u +%u)" = 1 ] && retry="--retry-failed"
          python3 ci/reconcile.py $retry > "$RUNNER_TEMP/stale.txt" 2> "$RUNNER_TEMP/failed.txt"
          echo "stale: $(cat "$RUNNER_TEMP/stale.txt")"
          cat "$RUNNER_TEMP/failed.txt"
      - name: Check the landing mode
        # An unknown UPDATE_MODE would silently match neither the commit
        # step nor the PR step: the sweep would compute its bumps and
        # discard them, and the run would still go green. Fail loudly
        # instead — the bumps are recomputed on the next run.
        run: |
          set -eu
          case "$MODE" in
            commit|pr) echo "landing mode: $MODE" ;;
            *) echo "::error::unknown UPDATE_MODE '$MODE' (expected commit or pr)"; exit 1 ;;
          esac
      # continue-on-error: one broken upstream feed must not discard the
      # good bumps the sweep already wrote — the commit below lands whatever
      # succeeded, and the final step turns the run red for visibility
      - name: Sweep upstream versions
        id: sweep
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # word splitting on PKGS is intended — it is a package list
          # shellcheck disable=SC2086
          if [ -n "${PKGS:-}" ]; then
            python3 ci/sweep/sweep.py --pkg $PKGS
          else
            python3 ci/sweep/sweep.py
          fi
      - name: Commit the bumps (mode=commit)
        if: env.MODE == 'commit' && !cancelled()
        run: |
          set -eu
          if [ -z "$(git status --porcelain)" ]; then
            echo "nothing to bump"
            exit 0
          fi
          date_tag="$(date -u +%Y%m%d)"
          pkgs="$(git status --porcelain -- pkgs/ | awk '{print $2}' | cut -d/ -f2 | sort -u | tr '\n' ' ')"
          git add pkgs/
          git commit -m "bump: ${date_tag} (${pkgs})"
          # main may have moved since checkout (manual push race): rebase and
          # retry instead of failing the scheduled sweep
          for attempt in 1 2 3; do
            if git fetch origin main && git rebase origin/main && git push origin HEAD:main; then
              break
            fi
            git rebase --abort 2>/dev/null || true
            if [ "$attempt" = 3 ]; then
              echo "push failed after 3 rebase attempts"; exit 1
            fi
            echo "push race (attempt ${attempt}) — rebasing onto origin/main"
          done
          echo "bumped and pushed: ${pkgs}"
          # a GITHUB_TOKEN push does not trigger workflow runs — dispatch the
          # cascade explicitly, scoped to the bumped packages (an unscoped
          # dispatch builds the whole registry on every bump wave)
          GH_TOKEN="${{ github.token }}" gh workflow run copr-build.yml --ref main -f only="${pkgs}"
      # !cancelled(), like commit mode: the sweep step is continue-on-error,
      # so one broken feed must not discard bumps that already succeeded
      - name: Open a bump PR (mode=pr)
        if: env.MODE == 'pr' && !cancelled()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          if [ -z "$(git status --porcelain)" ]; then
            echo "nothing to bump"
            exit 0
          fi
          date_tag="$(date -u +%Y%m%d)"
          pkgs="$(git status --porcelain -- pkgs/ | awk '{print $2}' | cut -d/ -f2 | sort -u | tr '\n' ' ')"
          git add pkgs/
          git commit -m "bump: ${date_tag} (${pkgs})"
          git checkout -B "bump/${date_tag}"
          # the branch is bot-owned and reset to the bumps of THIS run, so a
          # same-day re-run must be able to move it: a plain push is
          # rejected as non-fast-forward when the branch already exists
          git push -u --force origin "bump/${date_tag}"
          gh pr create --head "bump/${date_tag}" \
            --title "chore(bump): upstream versions $(date -u +%Y-%m-%d)" \
            --body "Automated by .github/workflows/update.yml (\`ci/sweep/sweep.py\`). Review the version transitions and merge — copr-build.yml then builds the changed packages and every package in a higher batch."
      - name: Resubmit packages Copr has not published
        if: "!cancelled()"
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          stale="$(cat "$RUNNER_TEMP/stale.txt")"
          [ -n "$stale" ] || exit 0
          gh workflow run copr-build.yml --ref main -f only="${stale}"
      # one rolling issue: opened/refreshed while a feed or build is broken,
      # closed when a run is clean — a stale package can never stay silent
      - name: Report problems in an issue
        if: "!cancelled()"
        env:
          GH_TOKEN: ${{ github.token }}
          SWEEP: ${{ steps.sweep.outcome }}
        run: |
          set -eu
          title="update: broken upstream feeds or failed Copr builds"
          num="$(gh issue list --state open --search "$title in:title" --json number --jq '.[0].number // empty')"
          if [ "$SWEEP" = success ] && [ ! -s "$RUNNER_TEMP/failed.txt" ]; then
            [ -z "$num" ] || gh issue close "$num" --comment "Clean run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
            exit 0
          fi
          body="Sweep: ${SWEEP}. Copr builds failed for: $(sed 's/^failed: //' "$RUNNER_TEMP/failed.txt" | tr '\n' ' ')
          Run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          if [ -n "$num" ]; then gh issue comment "$num" --body "$body"
          else gh issue create --title "$title" --body "$body"; fi
      # GitHub disables scheduled workflows after 60 days without repo
      # activity; re-enabling on every run keeps the daily floor alive.
      - name: Keep the schedule enabled
        if: "!cancelled()"
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow enable update.yml || true
      - name: Fail the run if a feed errored
        # the bumps above already landed; failing here only flags the broken
        # feed (red run + notifications) — it never blocks the other bumps.
        # A cancelled sweep counts as a failure too: nothing was swept, and
        # a green run would hide it.
        if: steps.sweep.outcome != 'success'
        run: |
          echo "one or more upstream feeds failed (or the sweep was cancelled) — see the sweep log above" >&2
          exit 1
