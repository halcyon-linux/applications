# ci/packages.toml — the applications build registry + sweep-feed config.
#
# 2026-10-27: comment-only resubmit marker — a push touching ci/** rebuilds
# the whole registry (ci/matrix.py INFRA_PREFIXES), the no-admin way to
# resubmit every Copr build without workflow_dispatch rights.
#
# Consumed by ci/matrix.py (build selection) and ci/sweep/sweep.py (version
# sweep). One table per package; **a package without an entry is not built**.
# The specs themselves live in pkgs/<pkg>/<pkg>.spec.
#
# Batches are dependency levels, not parallel groups within one job:
# copr-build.yml submits the waves sequentially and waits for each wave's
# Copr builds before the next — each successful build is immediately visible
# to the project repo, so a package may rely on anything built in a lower
# batch. Packages inside one batch must therefore never depend on each other.
#
# batch 0  every package — none BuildRequires another registry package, so
#          the whole registry builds in one wave (onlyoffice's heavy source
#          build included; batch semantics are dependency levels, not weight)
# The [pkg.updates] table drives the version sweep (update.yml) and is
# required for every package — sweep.py --check enforces it:
#   feed = "github-release"  + repo = "owner/name"   latest GitHub release tag
#   feed = "github-tag"      + repo = "owner/name"   newest git tag
#   feed = "custom"          + custom = "<name>"     ci/sweep/custom.py function

# --------------------------------------------------------------- desktops

# --- batch 0 ------------------------------------------------------------
[kitty]
batch = 0

[kitty.updates]
feed = "github-release"
repo = "kovidgoyal/kitty"

# zed: vendor rewrap of upstream's self-contained zed-linux tarball (same
# archive zed.dev/install.sh deploys), obsidian-style full brp nil set;
# x86_64 only.
[zed]
batch = 0

[zed.updates]
feed = "github-release"
repo = "zed-industries/zed"

# zen-browser: Firefox-based browser, vendor rewrap of the official Linux
# tarball (upstream ships no distro packages; full brp nil set per
# obsidian.spec, self-updater disabled via enterprise policy).
[zen-browser]
batch = 0

[zen-browser.updates]
feed = "github-release"
repo = "zen-browser/desktop"

# emacs-pgtk: GNU Emacs 31 pgtk source build from the ftp.gnu.org tarball
# (aot native compilation + tree-sitter; heavy ~2h build). The generic
# github-tag feed can't strip the "emacs-" tag prefix, so a custom feed
# ranks the emacs-mirror/emacs tags and HEAD-probes the ftp.gnu.org tarball
# (pretest tags' tarballs live on alpha.gnu.org and would 404 here).
[emacs-pgtk]
batch = 0

[emacs-pgtk.updates]
feed = "custom"
custom = "emacs-pgtk"

# zotero: rewrap of upstream's user-facing Linux tarball; the sweep
# HEAD-probes the tarball URL (10.0.4+ tarballs 403 the probe — documented
# in custom_zotero).
[zotero]
batch = 0

[zotero.updates]
feed = "custom"
custom = "zotero"

# ticktick: vendor rewrap of the official cloudfront .rpm; the version
# sweeps the AUR maintainer's pkgver pin.
[ticktick]
batch = 0

[ticktick.updates]
feed = "custom"
custom = "ticktick"

# bitwarden: rewrap of the vendor RPM following
# github.com/anudeepd/bitwarden-fedora-copr-ci (byte-identical payload, brp
# hooks unset, per-version GPL text, curated AppStream metainfo). Version
# sweeps the desktop-v releases of bitwarden/clients.
[bitwarden]
batch = 0

[bitwarden.updates]
feed = "custom"
custom = "bitwarden"

# obsidian: follows the Arch Linux package (launcher with user-flags file,
# resources icon, LicenseRef-Obsidian), with the bundled Electron runtime
# shipped since Fedora has no system electron package — it lands in the
# package's private libdir and the launcher gets that path substituted at
# build time. The tarball sha256 is verified in the source step against the
# GitHub digest.
[obsidian]
batch = 0

[obsidian.updates]
feed = "custom"
custom = "obsidian"

[opencode-desktop]
batch = 0

[opencode-desktop.updates]
feed = "custom"
custom = "opencode_desktop"

# claude-desktop: vendor rewrap of Anthropic's official .deb; the apt
# Packages index supplies both the version and the sha256.
[claude-desktop]
batch = 0

[claude-desktop.updates]
feed = "custom"
custom = "claude-desktop"

# claude-desktop-extra: rewrap of the community build's self-contained
# x86_64 RPM; the GitHub release tag carries the base version and the
# extra release number (v3.6556.2-7).
[claude-desktop-extra]
batch = 0

[claude-desktop-extra.updates]
feed = "custom"
custom = "claude-desktop-extra"

# claude-science: Anthropic's single-file linux-x64 release; the download
# endpoint publishes no sha256, so the feed pins the header's MD5.
[claude-science]
batch = 0

[claude-science.updates]
feed = "custom"
custom = "claude-science"

# chatgpt: vendor rewrap of OpenAI's official RPM (same name as upstream);
# the upstream yum repodata supplies the version, the upstream release
# number and the sha256.
[chatgpt]
batch = 0

[chatgpt.updates]
feed = "custom"
custom = "chatgpt"

# ferdium: vendor RPM rewrap on the ticktick pattern; tags and releases
# are 1:1 on ferdium-app.
[ferdium]
batch = 0

[ferdium.updates]
feed = "github-release"
repo = "ferdium/ferdium-app"

# openchamber: vendor rewrap of the official upstream RPM (Electron app);
# the sweep tracks openchamber/openchamber GitHub releases.
[openchamber]
batch = 0

[openchamber.updates]
feed = "github-release"
repo = "openchamber/openchamber"

# antigravity-cli: Google's proprietary vendor payload; the download URL
# embeds a per-release execution id Google exposes nowhere, so the sweep
# reads the AUR maintainer's pins (RPC pkgver + the PKGBUILD's _build).
[antigravity-cli]
batch = 0

[antigravity-cli.updates]
feed = "custom"
custom = "antigravity_cli"

# distroshelf: GNOME GUI for distrobox containers (ranfdev/DistroShelf);
# ships the distroshelf-helper launcher stub alongside the app.
[distroshelf]
batch = 0

[distroshelf.updates]
feed = "github-release"
repo = "ranfdev/DistroShelf"

# jupyterlab-desktop: vendor rewrap of the official Fedora RPM from
# jupyterlab/jupyterlab-desktop GitHub releases. Tag format vX.Y.Z-N;
# sweep extracts X.Y.Z as Version, pins full tag in %global upstream_tag.
[jupyterlab-desktop]
batch = 0

[jupyterlab-desktop.updates]
feed = "custom"
custom = "jupyterlab_desktop"

# appflowy: vendor rewrap of the official RPM from AppFlowy-IO/AppFlowy
# GitHub releases; tag is the version (e.g. 0.14.11), RPM filename embeds it.
# Custom feed so the RPM's sha256 is re-pinned on every bump.
[appflowy]
batch = 0

[appflowy.updates]
feed = "custom"
custom = "appflowy"

# ------------------------------------------------------------------ tools
# onlyoffice-desktopeditors: heavy vendor rewrap of ONLYOFFICE's el7-built
# suite (bundled Qt5/CEF/ICU under /opt/onlyoffice).
[onlyoffice-desktopeditors]
batch = 0

[onlyoffice-desktopeditors.updates]
feed = "github-release"
repo = "ONLYOFFICE/DesktopEditors"

# private-internet-access: vendor rewrap of the official self-contained
# installer; sweeps the AUR piavpn-bin pins (version, build id, tarball
# digest) — see the spec header for the Qt require exclusions.
[private-internet-access]
batch = 0

[private-internet-access.updates]
feed = "custom"
custom = "private-internet-access"

[mullvad-vpn]
batch = 0

[mullvad-vpn.updates]
feed = "custom"
custom = "mullvad-vpn"

# Proton chain: the GUI app + the root daemon and the python components it
# resolves through, all rewrapped from Proton's official Fedora RPMs.
[python3-proton-core]
batch = 0

[python3-proton-core.updates]
feed = "custom"
custom = "python3-proton-core"

[python3-proton-keyring-linux]
batch = 0

[python3-proton-keyring-linux.updates]
feed = "custom"
custom = "python3-proton-keyring-linux"

[python3-proton-vpn-api-core]
batch = 0

[python3-proton-vpn-api-core.updates]
feed = "custom"
custom = "python3-proton-vpn-api-core"

[proton-vpn-daemon]
batch = 0

[proton-vpn-daemon.updates]
feed = "custom"
custom = "proton-vpn-daemon"

[proton-vpn-gtk-app]
batch = 0

[proton-vpn-gtk-app.updates]
feed = "custom"
custom = "proton-vpn-gtk-app"

# bees: btrfs dedupe agent (Zygo/bees), source build imported from
# bazzite's spec_files/bees (0.11 + its four downstream patches) — Fedora
# still carries 0.10. Custom feed: upstream tags rc prereleases and ships
# no GitHub releases, which the generic feeds cannot rank correctly.
[bees]
batch = 0

[bees.updates]
feed = "custom"
custom = "bees"
